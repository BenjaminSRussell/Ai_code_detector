name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  install-smoke:
    # #20: a plain (non-editable) install must ship the CLIs and default config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install .
        run: pip install .
      - name: Console scripts resolve outside the checkout
        working-directory: /tmp
        run: |
          ai-code-detector --help
          ai-code-detector-enhanced --help
          ai-code-detector-agent-scan --help
          python -m ai_code_detector --help
          mkdir -p sample && printf 'def add(a, b):\n    return a + b\n' > sample/m.py
          ai-code-detector-agent-scan sample -o out
          test -f out/ai_scan_findings.json
