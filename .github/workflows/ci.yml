name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package + test deps
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  install-smoke:
    # #20: a plain (non-editable) install must ship the CLIs and default config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip install .
        run: pip install .
      - name: Console scripts resolve outside the checkout
        working-directory: /tmp
        run: |
          aicd --help
          aicd scan --help
          python -m ai_code_detector --help
          ai-code-detector --help
          ai-code-detector-enhanced --help
          ai-code-detector-agent-scan --help
          mkdir -p sample && printf 'def add(a, b):\n    return a + b\n' > sample/m.py
          aicd agent-scan sample -o out
          test -f out/ai_scan_findings.json
          aicd scan sample --mode basic -q -f json -o scan_out
          test -f scan_out/ai_detection_report_enhanced.json
          aicd explain sample/m.py --json --no-ml
          # #13: SARIF export validated in tests; ship one as a build artifact.
          aicd scan sample --mode basic -q -f sarif --sarif-min-probability 0 -o sarif_out
          aicd agent-scan sample -q --sarif -o sarif_out
          python -c "import json; d=json.load(open('sarif_out/ai_detection_report.sarif')); assert d['version']=='2.1.0'"
          # #12: PR gate from the installed package.
          aicd gate --root sample m.py --json gate.json --threshold 0.99
          python -c "import json; assert json.load(open('gate.json'))['passed']"
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@v4
        with:
          name: aicd-sarif
          path: |
            /tmp/sarif_out/ai_detection_report.sarif
            /tmp/sarif_out/ai_scan_findings.sarif
