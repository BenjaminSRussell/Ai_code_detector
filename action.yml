name: aicd PR gate
description: Score a pull request's changed source files with aicd and fail if any file is above an AI-probability threshold.
branding:
  icon: shield
  color: blue
inputs:
  threshold:
    description: Fail when a file's AI probability is above this (0-1). Empty = $AICD_THRESHOLD or 0.7.
    required: false
    default: ''
  mode:
    description: basic (heuristics, stable) or enhanced (adds the ML classifier).
    required: false
    default: basic
  base-ref:
    description: Branch to diff against (defaults to the PR base branch).
    required: false
    default: ''
  extensions:
    description: Space-separated git pathspecs for files to gate.
    required: false
    default: '*.py *.ts *.tsx *.js *.jsx *.go *.rs'
  report-dir:
    description: Where report.json / report.sarif / changed.txt are written.
    required: false
    default: aicd-gate
  upload-artifact:
    description: Upload report-dir as the `aicd-gate` artifact.
    required: false
    default: 'true'
outputs:
  flagged:
    description: Number of files above the threshold.
    value: ${{ steps.gate.outputs.flagged }}
runs:
  using: composite
  steps:
    - name: Install aicd
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Changed files
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref || github.base_ref }}
        REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        set -f  # pathspecs like *.py must reach git unexpanded
        mkdir -p "$REPORT_DIR"
        if [ -z "$BASE_REF" ]; then echo "::error::no base ref (run on pull_request or set base-ref)"; exit 2; fi
        git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
        # shellcheck disable=SC2086
        git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" -- ${{ inputs.extensions }} > "$REPORT_DIR/changed.txt" \
          || git diff --name-only --diff-filter=ACMR "origin/$BASE_REF" HEAD -- ${{ inputs.extensions }} > "$REPORT_DIR/changed.txt"
        echo "Changed source files: $(wc -l < "$REPORT_DIR/changed.txt")"
        cat "$REPORT_DIR/changed.txt"
    - name: Gate
      id: gate
      shell: bash
      env:
        AICD_THRESHOLD: ${{ inputs.threshold || env.AICD_THRESHOLD }}
        REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        set +e
        aicd gate --paths-from "$REPORT_DIR/changed.txt" --mode "${{ inputs.mode }}" \
          --json "$REPORT_DIR/report.json" --sarif "$REPORT_DIR/report.sarif"
        code=$?
        echo "flagged=$(python -c "import json;print(len(json.load(open('$REPORT_DIR/report.json'))['flagged']))" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
        exit $code
    - name: Upload report
      if: always() && inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: aicd-gate
        path: ${{ inputs.report-dir }}/
        if-no-files-found: ignore
